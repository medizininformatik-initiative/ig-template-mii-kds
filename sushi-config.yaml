id: de.medizininformatikinitiative.template.preview
packageId: de.medizininformatikinitiative.template.preview
canonical: https://github.com/medizininformatik-initiative/ig-template-mii-kds
name: MIIKDSTemplatePreview
title: MII KDS IG Template — Preview
description: >-
  Minimal preview IG that builds the de.medizininformatikinitiative.template IG
  template standalone so its branding (header, footer, CSS, logo) is rendered
  and visually reviewable in German (default) and English. Not an MII KDS
  module.
status: draft
version: 1.3.4
releaseLabel: ci-build
fhirVersion: 4.0.1
license: CC0-1.0
copyrightYear: 2027+
publisher:
  name: NUM-DIZ
  url: https://www.netzwerk-universitaetsmedizin.de
jurisdiction: urn:iso:std:iso:3166#DE "Germany"
parameters:
  # German leads: an MII KDS module's guide and package are German-first, and the
  # preview mirrors the model a module uses (docs/recipes/add-translation.md).
  i18n-default-lang: de
  i18n-lang:
    - en
  translation-sources:
    - input/translations/en
# Titles are in the DEFAULT language. Their English forms live as units in
# input/translations/en/ImplementationGuide-<id>.po; msgid must match these
# strings character for character.
pages:
  index.md:
    title: Startseite
  translationinfo.md:
    title: Hinweise zur Übersetzung

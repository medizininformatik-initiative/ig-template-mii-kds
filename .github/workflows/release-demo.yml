# Released-demo build + GitHub Pages publication.
#
# Purpose:   render the demo that the Pages root index lists as "the latest
#            release", FROM THE RELEASED TAG, publish it to
#            gh-pages/demo/<tag>/, and regenerate the root index so it lists
#            it. Replaces a manual promotion step.
#
# THE BUG THIS FIXES: the demo used to be copied by hand out of a feature-branch
#            preview built BEFORE Release Please bumped the version, so
#            demo/v0.5.1/en/index.html rendered "… — Preview v0.5.0". The path
#            claimed one release, the content another, and the root page linked
#            it as the release. Nothing here is hand-promoted: the build checks
#            out the TAG, the IG's own `version` is pinned to that tag before
#            SUSHI runs, and the render is verified to carry it. The root index
#            is GENERATED from the gh-pages tree (scripts/gen-pages-index.mjs),
#            so it can only ever link a demo that is actually deployed.
#
# Triggers:  release: published (the normal path — Release Please's release PR
#            is merged by a human, the release is published, this runs), plus
#            workflow_dispatch to re-render a given tag (input `tag`, e.g. after
#            a toolchain bump). A PRE-RELEASE is skipped on the release trigger:
#            it is not "the current release" and must not move the root index.
#            Dispatch can still render one — with `update_landing_page: false`
#            it publishes demo/<tag>/ without regenerating the index.
#
# Toggle:    vars.ENABLE_RELEASE_DEMO — ON by default; set the repo variable to
#            'false' to skip the job (it then shows as "skipped", not failed).
#            Same convention as ENABLE_PREVIEW / ENABLE_RELEASE_PLEASE.
#
# Terminology: auto-selected exactly as in ig-preview.yml — SU-TermServ via a
#            local client-cert nginx proxy when all three SU_TERMSERV_CLIENT_*
#            secrets are present, otherwise the HL7 tx.fhir.org fallback with a
#            ::notice. The build never hard-fails for lack of the credential.
#
# Human-gated: this workflow publishes NOTHING that a human did not already
#            gate. The gate is upstream and unchanged: Release Please's release
#            PR is merged by a human and the GitHub Release is published by a
#            human; only then does this run. It writes ONLY under
#            gh-pages/demo/<tag>/ plus the generated gh-pages/index.html — the
#            site root's other content and any version-like path stay
#            untouched, as does branches/ (the preview surface). Formal FHIR
#            publication is a different thing entirely and is not performed
#            here.
#
# Retention: older demo/<tag>/ directories are KEPT, never pruned. They are
#            permanent, externally linkable renderings of past releases, and the
#            stale-preview sweeper (cleanup-gh-pages.yml) cannot touch them —
#            it only removes directories carrying a .branch-name marker, which
#            this workflow deliberately does not write. The job reports the
#            accumulated size so the 1 GB Pages limit stays visible.
name: Release demo

on:
  # NOT `release: types: [published]`. release-please publishes the release with
  # the default GITHUB_TOKEN, and GitHub suppresses workflow triggers from events
  # that token raises (loop prevention) — so a release trigger here never fires and
  # the demo silently keeps serving the previous release. release-please.yml calls
  # this workflow directly instead, inside the run that created the release.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to render, e.g. v0.6.0"
        required: true
        type: string
      update_landing_page:
        description: "Regenerate the gh-pages root index after publishing"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re-)render, e.g. v0.5.1"
        required: true
        type: string
      update_landing_page:
        description: "Regenerate the gh-pages root index after publishing"
        required: false
        default: true
        type: boolean

permissions:
  contents: write # push the demo + generated root index to the gh-pages branch

concurrency:
  # OWN lane, not the shared gh-pages-writes group. In a shared group GitHub
  # REPLACES a still-queued run whenever a newer one arrives (cancel-in-progress
  # only protects running jobs) — measured three times: the post-release dev
  # push enqueued an IG-preview run into gh-pages-writes and evicted the queued
  # release demo. One demo at a time still holds via this group; write races on
  # the gh-pages BRANCH are handled by the push retry below.
  group: release-demo
  cancel-in-progress: false

# Toolchain pins. Identical to ig-preview.yml, under the SAME names — a
# workflow cannot read another workflow's env:, so the blocks are copies and
# scripts/toolchain-pins.test.mjs fails the build the moment they disagree.
# The names are also read VERBATIM by scripts/check-updates.mjs
# (parseWorkflowEnvPin), so the scheduled dependency monitor stays in sync.
env:
  PUBLISHER_VERSION: "2.3.2"
  # SHA-256 of publisher.jar for PUBLISHER_VERSION. ALWAYS bump this together
  # with PUBLISHER_VERSION — never one without the other.
  PUBLISHER_SHA256: "07c576024df917cc1f879b6b5a64147cd0222d5b4129688e8f0ad9ccce58b1d5"
  SUSHI_VERSION: "3.20.1"
  JEKYLL_VERSION: "4.4.1"

jobs:
  release-demo:
    if: ${{ vars.ENABLE_RELEASE_DEMO != 'false' }} # toggle: ON by default
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve the release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_UPDATE_PAGE: ${{ inputs.update_landing_page }}
        run: |
          set -euo pipefail
          if [ "${IS_PRERELEASE:-false}" = "true" ]; then
            echo "::notice::${RELEASE_TAG} is a pre-release — skipping the release demo. The root index lists the latest release; dispatch this workflow manually to render a pre-release under demo/<tag>/."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [ -z "${tag}" ]; then
            echo "::error::No release tag to build — pass the 'tag' input when dispatching manually."
            exit 1
          fi
          # SemVer with the repo's v-prefix, matching the tags Release Please cuts.
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::'${tag}' is not a vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          # `release: published` always regenerates the index; dispatch may opt out.
          update_page="true"
          if [ -z "${RELEASE_TAG:-}" ] && [ "${INPUT_UPDATE_PAGE}" = "false" ]; then
            update_page="false"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "update_page=${update_page}" >> "$GITHUB_OUTPUT"
          echo "Rendering demo for ${tag} (root-index regeneration: ${update_page})."

      # Two checkouts on purpose:
      #   * the workspace root is THIS ref — it supplies the publishing tooling
      #     (scripts/gen-pages-index.mjs). Taking it from the tag instead
      #     would make re-rendering an OLD release impossible, because that tag
      #     predates the tooling.
      #   * release-src/ is the TAG — the only thing that gets built.
      - name: Checkout the publishing tooling (this ref)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the released tag (the only source that is built)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: release-src
          persist-credentials: false

      - name: Pin the demo IG's own version to the tag
        if: ${{ steps.tag.outputs.skip != 'true' }}
        shell: bash
        working-directory: release-src
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Belt AND braces. sushi-config.yaml's `version:` is already kept in
          # step with the tag by Release Please's `extra-files` yaml updater
          # (release-please-config.json), so at the tag it SHOULD already equal
          # ${VERSION}. Asserting that alone would not be enough: the whole
          # point is that the rendered demo must be structurally unable to claim
          # a version other than the tag it was built from, so the value is
          # WRITTEN from the tag here rather than trusted.
          #
          # A mismatch is still reported — loudly, but as a warning, not a
          # failure: re-rendering a tag that predates the extra-files wiring
          # must stay possible.
          # \042 = double quote, \047 = single quote — spelled in octal so the
          # quoting survives both YAML and the shell unambiguously.
          declared="$(sed -nE 's/^version:[[:space:]]*//p' sushi-config.yaml | head -1 | sed -E 's/[[:space:]]*#.*$//' | tr -d '\042\047')"
          if [ "${declared}" != "${VERSION}" ]; then
            echo "::warning::sushi-config.yaml at ${TAG} declares version '${declared}', but the tag is ${VERSION}. Pinning the demo build to the tag; check the Release Please extra-files version sync in release-please-config.json."
          fi
          sed -i -E "s|^version:.*|version: ${VERSION}|" sushi-config.yaml
          grep -qE "^version: ${VERSION}\$" sushi-config.yaml
          echo "Demo IG version pinned to ${VERSION}."

      - name: Install Graphviz
        if: ${{ steps.tag.outputs.skip != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Set up Node.js (for SUSHI)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Java (for the IG Publisher)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby (for Jekyll)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Install Jekyll (pinned — the fhir2.base.template renders via Jekyll)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        run: gem install jekyll -v "${JEKYLL_VERSION}"

      - name: Select terminology server (SU-TermServ if the client-cert secrets are present, else HL7 fallback)
        id: tx
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          SU_TERMSERV_CLIENT_CERT: ${{ secrets.SU_TERMSERV_CLIENT_CERT }}
          SU_TERMSERV_CLIENT_KEY: ${{ secrets.SU_TERMSERV_CLIENT_KEY }}
          SU_TERMSERV_CLIENT_PASSWORD: ${{ secrets.SU_TERMSERV_CLIENT_PASSWORD }}
        run: |
          set -euo pipefail
          # All three secrets, not just the certificate: the key is decrypted
          # with the password below, so a partial set must fall back rather
          # than fail the build (docs/secrets.md — deleting the three secrets
          # one at a time must never break CI).
          if [ -n "${SU_TERMSERV_CLIENT_CERT:-}" ] && [ -n "${SU_TERMSERV_CLIENT_KEY:-}" ] && [ -n "${SU_TERMSERV_CLIENT_PASSWORD:-}" ]; then
            echo "SU-TermServ client certificate present — starting a local client-cert nginx proxy."
            mkdir -p nginx/certs
            # Pinned proxy config (kerndatensatz-meta, full commit SHA): forwards to
            # https://ontoserver.mii-termserv.de with the client certificate.
            curl -sSL -o nginx/nginx.conf \
              https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatz-meta/1db2e534704d92e5ee0cde663ce3e7ccd8825fa7/.github/workflows/nginx.conf
            echo "${SU_TERMSERV_CLIENT_CERT}" | base64 -d > nginx/certs/client-cert.pem
            echo "${SU_TERMSERV_CLIENT_KEY}"  | base64 -d > nginx/certs/client-key-encrypted.key
            openssl rsa -in nginx/certs/client-key-encrypted.key \
              -out nginx/certs/client-key.key -passin env:SU_TERMSERV_CLIENT_PASSWORD
            docker run -d --name su-termserv-proxy \
              -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
              -p 8090:80 \
              nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
            for i in $(seq 1 10); do
              if curl --head --silent --fail http://127.0.0.1:8090; then break; fi
              sleep 2
              if [ "$i" -eq 10 ]; then
                echo "::error::SU-TermServ proxy did not come up"; docker logs su-termserv-proxy || true; exit 1
              fi
            done
            echo "tx=http://127.0.0.1:8090/fhir" >> "$GITHUB_OUTPUT"
            echo "mode=SU-TermServ (ontoserver.mii-termserv.de via local proxy)" >> "$GITHUB_OUTPUT"
          else
            echo "tx=https://tx.fhir.org" >> "$GITHUB_OUTPUT"
            echo "mode=HL7 fallback (tx.fhir.org)" >> "$GITHUB_OUTPUT"
            echo "::notice::No SU-TermServ credential — falling back to HL7 tx.fhir.org. Some MII-specific value sets may not fully expand. Supply SU_TERMSERV_CLIENT_CERT / _KEY / _PASSWORD to route terminology to SU-TermServ."
          fi

      - name: Build the released demo IG (SUSHI + IG Publisher)
        if: ${{ steps.tag.outputs.skip != 'true' }}
        working-directory: release-src
        env:
          TX: ${{ steps.tx.outputs.tx }}
        run: |
          set -euo pipefail
          npm install -g "fsh-sushi@${SUSHI_VERSION}"
          sushi .
          curl -sSL -o publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          # Fail hard if the downloaded jar is not the pinned, verified artifact.
          echo "${PUBLISHER_SHA256}  publisher.jar" | sha256sum --check
          # -fhir-settings allowlists the local SU-TermServ nginx proxy
          # (http://127.0.0.1:8090) for the publisher's terminology access:
          # publisher 2.3.1+ SSRF hardening can refuse plain-HTTP/private-
          # network -tx targets without it (basis idiom, kerndatensatz-basis
          # @190a3a18). Inert on the tx.fhir.org fallback path.
          java -Xmx6g -jar publisher.jar -ig ig.ini -tx "${TX}" \
            -fhir-settings "${GITHUB_WORKSPACE}/.github/fhir-settings.json"

      - name: Enforce QA gate (errors must be 0) and verify the rendered version
        if: ${{ steps.tag.outputs.skip != 'true' }}
        working-directory: release-src
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          test -s output/index.html
          jq empty output/qa.json
          errs="$(jq -r '.errs // 0' output/qa.json)"
          echo "IG Publisher reported ${errs} error(s) (terminology: ${{ steps.tx.outputs.mode }})."
          if [ "${errs}" -ne 0 ]; then
            echo "::error::Release demo build has ${errs} QA error(s); refusing to publish it. See output/qa.html."
            exit 1
          fi
          # The whole point of this workflow: what was RENDERED must carry the
          # tag's version. Read it back from the generated ImplementationGuide
          # rather than from the rendered HTML, so the check does not depend on
          # how the IG template happens to format the title.
          ig_json="$(ls -1 fsh-generated/resources/ImplementationGuide-*.json | head -1)"
          test -s "${ig_json}"
          built="$(jq -r '.version' "${ig_json}")"
          if [ "${built}" != "${VERSION}" ]; then
            echo "::error::The built demo declares version '${built}' but was built from tag v${VERSION}. Refusing to publish a demo that misstates its release."
            exit 1
          fi
          echo "Rendered demo verified at version ${built}."

      - name: Stop terminology proxy
        if: always()
        run: docker rm -f su-termserv-proxy >/dev/null 2>&1 || true

      - name: Upload build output (qa report + rendered site)
        if: ${{ always() && steps.tag.outputs.skip != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-demo-output-${{ steps.tag.outputs.tag }}
          path: |
            release-src/output/qa.json
            release-src/output/qa.html
            release-src/output/index.html
          if-no-files-found: warn

      - name: Publish to gh-pages/demo/<tag>/ and regenerate the root index
        id: publish
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          UPDATE_PAGE: ${{ steps.tag.outputs.update_page }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          rm -rf gh-pages
          if ! git ls-remote --heads "${remote_url}" gh-pages | grep -q .; then
            echo "::error::No gh-pages branch yet. Let ig-preview.yml create it (push any branch) before publishing a release demo."
            exit 1
          fi
          git clone --depth 1 --branch gh-pages "${remote_url}" gh-pages

          # ONLY demo/<tag>/ is written. The site root's other content and any
          # version-like path stay untouched, and so does branches/.
          demo_dir="gh-pages/demo/${TAG}"
          rm -rf "${demo_dir}"
          mkdir -p "${demo_dir}"
          cp -R release-src/output/. "${demo_dir}/"
          # Deliberately NO .branch-name marker: that marker is what makes a
          # directory a sweepable preview (cleanup-gh-pages.yml). A released
          # demo is permanent.
          if [ -e "${demo_dir}/.branch-name" ]; then
            echo "::error::The build output carries a .branch-name marker — a released demo must never be sweepable."
            exit 1
          fi
          # Serve the IG output verbatim — never let Pages re-run Jekyll on it.
          touch gh-pages/.nojekyll

          if [ "${UPDATE_PAGE}" = "true" ]; then
            # Regenerate the plain root index from what is actually deployed.
            # The generator CREATES gh-pages/index.html when it is missing (no
            # index-to-repoint guard needed any more) and lists ONLY the dev
            # preview plus the highest-semver demo/<tag>/ — which after the
            # copy above is normally ${TAG}, unless an OLD tag is being
            # re-rendered, in which case the index correctly keeps listing the
            # latest release. Everything else stays deployed but unlisted.
            node scripts/gen-pages-index.mjs gh-pages | tee "${RUNNER_TEMP}/index-gen.txt"
          else
            echo "::notice::update_landing_page=false — demo/${TAG}/ published without regenerating the root index."
          fi

          cd gh-pages
          # Older demo/<tag>/ directories are KEPT (see the header). Report the
          # accumulated size so the 1 GB Pages limit stays visible.
          demo_bytes="$(du --bytes --summarize demo | cut -f1)"
          bytes="$(du --bytes --summarize --exclude=.git . | cut -f1)"
          echo "demo/ holds $(ls -1 demo | wc -l) released rendering(s), ${demo_bytes} bytes; whole site ${bytes} bytes."
          if [ "${bytes}" -gt 1000000000 ]; then
            echo "::warning::Staged Pages site is ${bytes} bytes, above the 1 GB GitHub Pages support limit; deployment may not be guaranteed. Consider retiring the oldest demo/<tag>/ directories (and every link to them)."
          fi

          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add --all
          if git diff --cached --quiet; then
            echo "No demo changes to publish for ${TAG}."
          else
            git commit -m "chore: publish rendered demo for ${TAG}"
            # gh-pages is written by several workflows in separate lanes now, so a
            # concurrent push is possible: retry with a rebase pull, bounded.
            for attempt in 1 2 3 4 5; do
              if git push origin gh-pages; then break; fi
              [ "$attempt" = "5" ] && { echo "::error::gh-pages push failed after 5 attempts"; exit 1; }
              git pull --rebase origin gh-pages
              sleep $(( attempt * 5 ))
            done
          fi

          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO#*/}/demo/${TAG}/"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release demo — ${TAG}"
            echo ""
            echo "- [Rendered demo IG](${url})"
            echo "- Root index: https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO#*/}/"
            echo "- Terminology: ${{ steps.tx.outputs.mode }}"
            echo ""
            if [ -s "${RUNNER_TEMP}/index-gen.txt" ]; then
              echo "<details><summary>Root-index regeneration</summary>"
              echo ""
              echo '```text'
              cat "${RUNNER_TEMP}/index-gen.txt"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Demo URL (always-visible fallback)
        if: ${{ always() && steps.publish.outputs.url != '' }}
        env:
          DEMO_URL: ${{ steps.publish.outputs.url }}
        run: |
          echo "Demo URL: ${DEMO_URL}"
